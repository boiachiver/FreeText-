name: Apply separate admin login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply separate admin login')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          marker = 'function AdminLogin() {'
          if marker not in s:
              needle = 'function AdminDenied() {\n  return <div className="auth-page"><div className="auth-card"><div className="auth-logo"><Shield size={30} /></div><h1>Admin access denied</h1><p className="auth-subtitle">This area is restricted to the FreeText super administrator.</p><button onClick={() => window.location.assign("/")}>Return to FreeText</button></div></div>;\n}\n'
              component = '''\nfunction AdminLogin() {\n  const [email, setEmail] = useState(\"\");\n  const [password, setPassword] = useState(\"\");\n  const [loading, setLoading] = useState(false);\n  const [error, setError] = useState(\"\");\n\n  const login = async (event: React.FormEvent) => {\n    event.preventDefault();\n    setError(\"\");\n    if (!email.trim() || !password) {\n      setError(\"Enter the administrator email and password.\");\n      return;\n    }\n    setLoading(true);\n    const { data, error: loginError } = await supabase.auth.signInWithPassword({ email: email.trim(), password });\n    if (loginError || !data.session) {\n      setLoading(false);\n      setError(loginError?.message || \"Unable to sign in.\");\n      return;\n    }\n    const { data: allowed, error: roleError } = await supabase.rpc(\"is_super_admin\");\n    setLoading(false);\n    if (roleError || !allowed) {\n      await supabase.auth.signOut();\n      setError(\"This account is not authorized as a FreeText super administrator.\");\n      return;\n    }\n    window.location.reload();\n  };\n\n  return <div className=\"auth-page\">\n    <div className=\"auth-glow auth-glow-one\" />\n    <div className=\"auth-glow auth-glow-two\" />\n    <section className=\"auth-card\">\n      <div className=\"auth-brand\"><div className=\"auth-logo\"><Shield size={28} /></div><span>FreeText Admin</span></div>\n      <h1 className=\"auth-heading\">Administrator Login</h1>\n      <p className=\"auth-helper\">Secure access to the FreeText administration center.</p>\n      <form className=\"auth-form\" onSubmit={login}>\n        <div className=\"auth-input-wrap\"><User size={18} /><input className=\"auth-input\" type=\"email\" autoComplete=\"username\" placeholder=\"Administrator email\" value={email} onChange={e => setEmail(e.target.value)} /></div>\n        <div className=\"auth-input-wrap\"><Lock size={18} /><input className=\"auth-input\" type=\"password\" autoComplete=\"current-password\" placeholder=\"Administrator password\" value={password} onChange={e => setPassword(e.target.value)} /></div>\n        {error && <div className=\"auth-error\">{error}</div>}\n        <button className=\"auth-primary-button\" type=\"submit\" disabled={loading}>{loading ? \"Signing in securely...\" : \"Sign in to Admin Center\"}</button>\n        <button className=\"auth-phone-button\" type=\"button\" onClick={() => window.location.assign(\"/\")}>Back to FreeText</button>\n      </form>\n      <p className=\"auth-terms\">Admin access is restricted to authorized FreeText super administrators.</p>\n    </section>\n  </div>;\n}\n'''
              if needle not in s:
                  raise SystemExit('AdminDenied block not found')
              s = s.replace(needle, needle + component)
              p.write_text(s)
          PY

      - name: Add admin route before normal login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          needle = '  if (authLoading) return <LoadingScreen message="Loading your account..." />;\n  if (!session || verificationGate) return <Auth />;'
          replacement = '  if (authLoading) return <LoadingScreen message="Loading your account..." />;\n  if (window.location.pathname === "/admin" && (!session || verificationGate)) return <AdminLogin />;\n  if (!session || verificationGate) return <Auth />;'
          if needle in s and 'pathname === "/admin" && (!session || verificationGate)' not in s:
              s = s.replace(needle, replacement)
              p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "FreeText Admin Bot"
          git config user.email "actions@github.com"
          git add src/App.tsx
          git diff --cached --quiet || git commit -m "Apply separate admin login"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/apply-admin-login.yml
          git commit -m "Remove temporary admin login patch workflow"
          git push
