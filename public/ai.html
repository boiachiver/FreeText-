<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Boi Achiver AI</title>
<style>
:root{--bg:#050816;--panel:#0b1224;--line:#213a66;--text:#f7f9ff;--muted:#8f9dbb;--blue:#18bfff;--purple:#8b5cff;--green:#53e6a0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#10265b 0,#071022 30%,#03050d 72%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}
main{width:min(760px,100%);min-height:100vh;margin:auto;padding-bottom:112px}
header{position:sticky;top:0;z-index:10;padding:12px 16px 13px;background:#050816f2;backdrop-filter:blur(20px);border-bottom:1px solid #35517f55}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.brandLogo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#08d9ff,#1e70ff 52%,#9a4dff);box-shadow:0 0 28px #18bfff35;border:1px solid #ffffff25;font-size:22px;font-weight:950;font-style:italic;letter-spacing:-4px;padding-right:4px}.brandText b{display:block;font-size:19px;line-height:1.05}.brandText span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.headBtns{display:flex;gap:7px}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#0a1223;color:#dce6ff;font-size:19px}.status{font-size:10px;color:var(--muted);margin:8px 2px 0}.status.ready{color:var(--green)}.context{font-size:9px;color:#65738f;margin:3px 2px 0}
.hero{text-align:center;padding:30px 16px 18px}.heroMark{width:68px;height:6px;margin:0 auto 18px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 0 22px #18bfff66}.hero h1{font-size:27px;margin:0 0 7px;letter-spacing:-.5px}.hero p{margin:0 auto;color:var(--muted);font-size:13px;line-height:1.5;max-width:480px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:8px 14px 20px}.quick button{min-height:74px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0b152b,#091021);color:#f5f7ff}.quick button:active{transform:scale(.98)}.quick strong{display:block;font-size:12px}.quick small{display:block;color:#8e9cba;margin-top:4px;font-size:10px}.qicon{font-size:20px;margin-bottom:5px;display:block}
.chat{padding:0 14px}.empty{text-align:center;color:var(--muted);padding:12px 10px 20px;font-size:12px}.msg{max-width:91%;padding:12px 14px;margin:9px 0;border-radius:18px;white-space:pre-wrap;line-height:1.55;font-size:14px;word-break:break-word}.user{margin-left:auto;background:linear-gradient(135deg,#106bc1,#5b31b0);border-bottom-right-radius:5px}.ai{background:linear-gradient(180deg,#111b31,#0c1425);border:1px solid #23385d;border-bottom-left-radius:5px}.error{color:#ffb5b5}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:9px 12px calc(10px + env(safe-area-inset-bottom));background:#050816f7;backdrop-filter:blur(20px);border-top:1px solid #35517f55}.box{width:min(760px,100%);margin:auto;display:flex;gap:7px;align-items:flex-end;padding:7px;background:#0a1223;border:1px solid #29446f;border-radius:22px;box-shadow:0 10px 40px #0008}textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:10px 8px;font:14px system-ui}textarea::placeholder{color:#71809f}#send{width:54px;height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:20px;font-weight:900}#send:disabled{opacity:.55}.composerHint{width:min(760px,100%);margin:5px auto 0;text-align:center;color:#566581;font-size:9px}
@media(max-width:600px){.quick{grid-template-columns:repeat(2,1fr)}.hero{padding-top:25px}.hero h1{font-size:24px}.msg{max-width:95%}}
</style>
</head>
<body>
<main>
<header>
<div class="top"><div class="brand"><div class="brandLogo" aria-label="Boi Achiver AI">BA</div><div class="brandText"><b>Boi Achiver AI</b><span>Your Personal AI Assistant</span></div></div><div class="headBtns"><button class="iconBtn" type="button" title="History" aria-label="History">◷</button><button class="iconBtn" type="button" title="Settings" aria-label="Settings">⚙</button></div></div>
<div id="status" class="status">Checking online AI…</div><div id="contextStatus" class="context">FreeText context: checking…</div>
</header>
<section class="hero"><div class="heroMark"></div><h1>What can I help you with?</h1><p>Chat with me, build something, learn something, or solve a problem.</p></section>
<section class="quick" aria-label="Quick actions">
<button type="button" data-prompt="Let's chat. How are you today?"><span class="qicon">💬</span><strong>Chat</strong><small>Ask anything</small></button>
<button type="button" data-prompt="Help me write a complete working piece of code. Ask what I want to build only if you truly need to."><span class="qicon">&lt;/&gt;</span><strong>Write Code</strong><small>Build & fix</small></button>
<button type="button" data-prompt="Give me a few useful ideas for something I can build or create today."><span class="qicon">💡</span><strong>Get Ideas</strong><small>Plan & create</small></button>
<button type="button" data-prompt="Teach me something useful step by step in a beginner-friendly way."><span class="qicon">🎓</span><strong>Learn</strong><small>Step by step</small></button>
<button type="button" data-prompt="Explain a difficult topic to me simply and clearly."><span class="qicon">📄</span><strong>Explain</strong><small>Simple & clear</small></button>
<button type="button" data-prompt="Help me explore a topic and tell me what I should know about it."><span class="qicon">🌐</span><strong>Explore</strong><small>Search & learn</small></button>
</section>
<section id="chat" class="chat"><div class="empty" id="empty">Ready when you are.</div></section>
<form class="composer" id="form"><div class="box"><textarea id="input" placeholder="Type your message…" rows="1"></textarea><button id="send" type="submit" aria-label="Send">➤</button></div><div class="composerHint">Boi Achiver AI • FreeText</div></form>
</main>
<script>
const chat=document.querySelector('#chat'),empty=document.querySelector('#empty'),input=document.querySelector('#input'),form=document.querySelector('#form'),send=document.querySelector('#send'),status=document.querySelector('#status'),contextStatus=document.querySelector('#contextStatus');
const MEMORY_KEY='boi_achiver_ai_memory_online_v1',CONTEXT_KEY='freetext_ai_context_v1';let history=loadMemory(),sending=false;
function loadMemory(){try{const v=JSON.parse(localStorage.getItem(MEMORY_KEY)||'[]');return Array.isArray(v)?v.filter(x=>x&&(x.role==='user'||x.role==='assistant')&&typeof x.content==='string').slice(-12):[]}catch{return[]}}
function saveMemory(){try{localStorage.setItem(MEMORY_KEY,JSON.stringify(history.slice(-12)))}catch{}}
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
function add(t,w){if(empty)empty.remove();const d=document.createElement('div');d.className='msg '+w;d.textContent=t;chat.appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});return d}
function getContext(){try{const v=JSON.parse(localStorage.getItem(CONTEXT_KEY)||'null');if(!v||typeof v!=='object'){contextStatus.textContent='FreeText context: not available';return null}const p=[];if(v.profile)p.push('profile');if(Array.isArray(v.posts)&&v.posts.length)p.push(v.posts.length+' posts');if(Array.isArray(v.notifications)&&v.notifications.length)p.push(v.notifications.length+' notifications');if(Array.isArray(v.stories)&&v.stories.length)p.push(v.stories.length+' stories');if(Array.isArray(v.messages)&&v.messages.length)p.push(v.messages.length+' messages');contextStatus.textContent=p.length?'FreeText context: '+p.join(' • '):'FreeText context: connected';return{profile:v.profile||null,posts:Array.isArray(v.posts)?v.posts.slice(0,10):[],notifications:Array.isArray(v.notifications)?v.notifications.slice(0,10):[],stories:Array.isArray(v.stories)?v.stories.slice(0,10):[],messages:Array.isArray(v.messages)?v.messages.slice(-12):[]}}catch{contextStatus.textContent='FreeText context: not available';return null}}
function render(){history.slice(-8).forEach(m=>add(m.content,m.role==='assistant'?'ai':'user'))}
async function checkOnline(){try{const response=await fetch('/api/ai',{cache:'no-store'});const data=await response.json().catch(()=>({}));if(response.ok&&data.configured){setStatus('Online AI ready','ready')}else if(response.ok&&!data.configured){setStatus('AI backend needs its OpenAI key')}else{setStatus('AI backend unavailable')}}catch{setStatus('AI backend unavailable')}}
async function ask(text){const context=getContext();const response=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[...history.slice(-10),{role:'user',content:text}],context})});const data=await response.json().catch(()=>({}));if(!response.ok||!data?.text){throw new Error(data?.error||'The online AI is unavailable.')}return String(data.text).trim()}
async function submitText(text){text=text.trim();if(!text||sending)return;input.value='';add(text,'user');history.push({role:'user',content:text});saveMemory();sending=true;send.disabled=true;send.textContent='…';setStatus('Thinking…');try{const answer=await ask(text);add(answer,'ai');history.push({role:'assistant',content:answer});saveMemory();setStatus('Online AI ready','ready')}catch(err){console.error(err);const detail=String(err?.message||'The online AI is unavailable.');add(detail,'ai error');setStatus('Connection unavailable')}finally{sending=false;send.disabled=false;send.textContent='➤';input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();submitText(input.value)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>submitText(b.dataset.prompt)));window.addEventListener('storage',e=>{if(e.key===CONTEXT_KEY)getContext()});setInterval(getContext,5000);getContext();checkOnline();render();input.focus();
</script>
</body>
</html>
