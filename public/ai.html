<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Boi Achiver AI — private local AI assistant." />
  <title>Boi Achiver AI</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f6f8}
    *{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
    .top{padding:18px 16px;border-bottom:1px solid #ddd;background:#fff;position:sticky;top:0;z-index:2}.brand{font-size:22px;font-weight:800}.sub{font-size:13px;color:#667;margin-top:4px}.status{margin-top:9px;font-size:12px;color:#667}.status.ready{color:#16733a}.status.error{color:#b42318}
    .chat{flex:1;padding:18px 14px 125px}.msg{max-width:84%;padding:12px 14px;border-radius:18px;margin:10px 0;white-space:pre-wrap;line-height:1.5}.user{margin-left:auto;background:#111;color:#fff;border-bottom-right-radius:5px}.ai{background:#fff;border:1px solid #ddd;border-bottom-left-radius:5px}.empty{text-align:center;color:#777;padding-top:25vh}
    .composer{position:fixed;bottom:0;left:0;right:0;padding:10px;background:rgba(245,246,248,.97);border-top:1px solid #ddd}.box{max-width:900px;margin:auto;display:flex;gap:8px}.box textarea{flex:1;resize:none;border:1px solid #ccc;border-radius:18px;padding:12px;font:inherit;min-height:48px;outline:none}.box button{border:0;border-radius:18px;padding:0 18px;background:#111;color:#fff;font-weight:700}.box button:disabled{opacity:.55}.tools{max-width:900px;margin:7px auto 0;font-size:12px;color:#555}.privacy{font-size:11px;color:#777;margin-top:5px}
    @media(max-width:600px){.msg{max-width:94%}}
  </style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">🤖 Boi Achiver AI</div>
    <div class="sub">Private local AI • FreeText knowledge • No OpenAI API key</div>
    <div id="status" class="status">Loading the local AI model…</div>
  </header>
  <section id="chat" class="chat"><div class="empty" id="empty">Boi Achiver AI is starting…<br/>Your local FreeText assistant is loading.</div></section>
  <form class="composer" id="form">
    <div class="box"><textarea id="input" placeholder="Message Boi Achiver AI…" rows="1" disabled></textarea><button id="send" disabled>Loading…</button></div>
    <div class="tools"><span>🔒 Local AI • FreeText knowledge • local conversation memory</span><div class="privacy">No OpenAI key is used. No request is sent to /api/ai.</div></div>
  </form>
</main>
<script type="module">
  import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

  const chat=document.querySelector("#chat");
  const empty=document.querySelector("#empty");
  const input=document.querySelector("#input");
  const form=document.querySelector("#form");
  const send=document.querySelector("#send");
  const status=document.querySelector("#status");
  const MEMORY_KEY="boi_achiver_ai_memory_v1";
  const history=loadMemory();
  let generator=null;

  const freeTextKnowledge=`
You are Boi Achiver AI, the built-in assistant for FreeText.
FreeText is a social communication platform built with React, TypeScript, Vite and Supabase.
FreeText includes accounts, profiles, search, follows, posts, stories, comments, notifications, chat, uploads, reports, verification, admin controls, audit logs, themes and realtime features.
The FreeText AI interface is mobile-first and is designed to work well on phones.
Boi Achiver AI currently runs locally in the browser with an open-source Qwen2.5 0.5B Instruct model through Transformers.js. It does not require an OpenAI API key.
The local model does not automatically have live Internet access. Never pretend that it does.
Boi Achiver AI should be friendly, clear, practical and honest. For coding questions, give simple steps suitable for a beginner and prefer FreeText examples when relevant.
If asked about FreeText features that are not listed here, say that you do not have enough information instead of inventing details.
`;

  function loadMemory(){
    try{
      const saved=JSON.parse(localStorage.getItem(MEMORY_KEY)||"[]");
      return Array.isArray(saved)?saved.filter(x=>x&&typeof x.content==="string"&&typeof x.role==="string").slice(-12):[];
    }catch{return []}
  }

  function saveMemory(){
    try{localStorage.setItem(MEMORY_KEY,JSON.stringify(history.slice(-12)));}catch{}
  }

  function add(text,who){
    if(empty) empty.remove();
    const d=document.createElement("div");
    d.className="msg "+who;
    d.textContent=text;
    chat.appendChild(d);
    window.scrollTo(0,document.body.scrollHeight);
  }

  function setStatus(text,type=""){
    status.textContent=text;
    status.className="status "+type;
  }

  async function loadModel(){
    try{
      setStatus("Loading Boi Achiver AI locally…");
      const useWebGPU=!!navigator.gpu;
      generator=await pipeline("text-generation","Xenova/Qwen2.5-0.5B-Instruct",{
        device:useWebGPU?"webgpu":"wasm",
        dtype:useWebGPU?"q4f16":"q4"
      });
      setStatus(useWebGPU?"Boi Achiver AI ready • WebGPU local mode":"Boi Achiver AI ready • local WASM mode","ready");
      input.disabled=false;
      send.disabled=false;
      send.textContent="Send";
      input.focus();
      if(empty) empty.innerHTML="Boi Achiver AI is ready.<br/>I know the FreeText project and can remember this local chat.";
      history.slice(-8).forEach(message=>add(message.content,message.role==="assistant"?"ai":"user"));
    }catch(error){
      console.error(error);
      setStatus("The local AI model could not start.","error");
      if(empty) empty.innerHTML="I couldn't start the local AI model.<br/>Try a browser with WebGPU support, then reload the page.";
      send.textContent="Unavailable";
    }
  }

  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const text=input.value.trim();
    if(!text||!generator)return;
    input.value="";
    add(text,"user");
    history.push({role:"user",content:text});
    saveMemory();
    send.disabled=true;
    send.textContent="Thinking…";
    try{
      const recent=history.slice(-8);
      const prompt=[
        {role:"system",content:freeTextKnowledge+"\nAlways identify yourself as Boi Achiver AI when appropriate. Do not claim to be a human or the owner. Keep answers useful and concise."},
        ...recent
      ];
      const result=await generator(prompt,{max_new_tokens:256,do_sample:true,temperature:0.65,top_p:0.9,return_full_text:false});
      const answer=Array.isArray(result)?(result[0]?.generated_text||""):"";
      const clean=typeof answer==="string"?answer.trim():"";
      const finalText=clean||"I couldn't generate a response. Please try again.";
      add(finalText,"ai");
      history.push({role:"assistant",content:finalText});
      saveMemory();
    }catch(error){
      console.error(error);
      add("I had trouble thinking locally. Please try again.","ai");
    }finally{
      send.disabled=false;
      send.textContent="Send";
      input.focus();
    }
  });

  input.addEventListener("keydown",event=>{
    if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();form.requestSubmit();}
  });

  loadModel();
</script>
</body>
</html>
