<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreeText" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/freetext-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/freetext-icon.svg" />
    <title>FreeText — Connect, Share & Chat</title>
    <meta name="description" content="FreeText is a modern social platform for connecting with friends, sharing posts and stories, messaging, calls, communities and Boi Achiver AI." />
    <link rel="canonical" href="https://freetext-app.vercel.app/" />
    <style>
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#05060a}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#root{min-height:100vh}
      #freetext-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05060a;color:white;transition:opacity .65s ease,visibility .65s ease}#freetext-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}.ft-blob{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(100px);opacity:.25;pointer-events:none}.ft-blob.one{top:-150px;left:-140px;background:#4f46e5}.ft-blob.two{right:-140px;bottom:-150px;background:#9333ea}.ft-center{position:relative;z-index:2;width:min(92vw,460px);padding:24px;text-align:center}.ft-logo-wrap{position:relative;width:112px;height:112px;margin:0 auto 28px;display:grid;place-items:center}.ft-ring{position:absolute;inset:0;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin 2.2s linear infinite}.ft-logo{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#4f46e5,#818cf8);box-shadow:0 0 50px rgba(79,70,229,.45)}.ft-logo svg{width:36px;height:36px;fill:white}.ft-title{margin:0;font-size:clamp(32px,9vw,46px);line-height:1;font-weight:900;letter-spacing:-.04em;background:linear-gradient(90deg,#818cf8,#c084fc,#f472b6,#818cf8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3.2s linear infinite}.ft-tagline{margin:12px 0;color:#737b8c;font-size:11px;letter-spacing:.24em;text-transform:uppercase}.ft-progress{width:min(280px,80vw);height:4px;margin:28px auto 0;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}.ft-progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6,#ec4899);animation:fill 2.2s ease forwards}.ft-install{display:none;margin:22px auto 0;padding:12px 18px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;cursor:pointer}.ft-status{margin-top:14px;color:#656d7c;font-size:11px}.ft-footer{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));text-align:center;color:#3f4653;font-size:10px}.ft-footer strong{color:#6366f1}@keyframes spin{to{transform:rotate(360deg)}}@keyframes shimmer{to{background-position:200% center}}@keyframes fill{to{width:100%}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="freetext-splash" aria-label="FreeText loading screen"><div class="ft-blob one"></div><div class="ft-blob two"></div><main class="ft-center"><div class="ft-logo-wrap"><div class="ft-ring"></div><div class="ft-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.2 2 4 13h6.2L8.8 22 20 9.1h-6.5L13.2 2Z"/></svg></div></div><h1 class="ft-title">FreeText</h1><p class="ft-tagline">Chat · Status · Calls · AI</p><div class="ft-progress"><i></i></div><button id="ft-install" class="ft-install">Install FreeText app</button><div class="ft-status">Initializing FreeText…</div></main><footer class="ft-footer">Made with <strong>⚡</strong> by Boi Achiever</footer></div>
    <script>
      (function(){const splash=document.getElementById('freetext-splash'),button=document.getElementById('ft-install');let promptEvent=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;button.style.display='block';});button.addEventListener('click',async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;button.style.display='none';}else if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){alert('On iPhone: tap Share in Safari, then Add to Home Screen.');}else{alert('Open your browser menu and choose Install app or Add to Home screen.');}});const enter=()=>{if(!splash)return;splash.classList.add('is-hidden');setTimeout(()=>splash.style.display='none',700)};setTimeout(enter,2500);setTimeout(enter,4500)})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
